<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="icons/ui/favicon.png">
<link rel="apple-touch-icon" href="icons/ui/icon-192.webp">
<title>RealmClash</title>
<meta name="theme-color" content="#161a1d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---- style.css ---- */
:root{
    color-scheme: dark;
    --bg:#161a1d; --bg-grad:#161a1d; --panel:#1f2428; --panel-2:#272d32;
    --border:#333b42; --border-soft:#2a3137;
    --brass:#3b82f6; --brass-bright:#60a5fa;
    --verdigris:#22c55e; --verdigris-bright:#4ade80;
    --arcane:#3b82f6; --arcane-bright:#60a5fa;
    --parchment:#f1f5f9; --text:#cbd5e1; --text-dim:#94a3b8; --text-faint:#64748b;
    --danger:#dc2626; --danger-bright:#ef4444;
    --font-display:'Inter',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]){ color-scheme: dark; }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){ color-scheme: dark; }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top: var(--safe-t);}
  body{
    margin:0;
    background:
      radial-gradient(900px 560px at 14% -8%, var(--bg-grad) 0%, transparent 60%),
      radial-gradient(700px 500px at 100% 100%, #1a130c 0%, transparent 55%) fixed,
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-top:var(--safe-t);
    padding-bottom:var(--safe-b);
    overflow-x:hidden;
  }
  h1,h2,h3,h4{font-family:var(--font-display); letter-spacing:.015em; margin:0; font-weight:600; color:var(--parchment);}
  p{margin:0;}
  button{font-family:var(--font-body); cursor:pointer;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
  ::selection{background:var(--brass); color:#180f06;}

  a{color:var(--brass-bright);}

  .btn{
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 16px;
    border-radius:4px;
    font-size:14px;
    font-weight:600;
    font-family:var(--font-body);
    transition:transform .08s ease, border-color .15s ease, background .15s ease;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  }
  .btn:hover:not(:disabled){border-color:var(--text-faint); background:var(--border-soft);}
  .btn:active:not(:disabled){transform:scale(.97);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn-primary{background:linear-gradient(180deg, var(--brass-bright), var(--brass)); border-color:#8a6a2e; color:#1a1f23; text-shadow:0 1px 0 rgba(255,255,255,.15);}
  .btn-primary:hover:not(:disabled){background:linear-gradient(180deg, #ecc37c, var(--brass-bright)); border-color:var(--brass);}
  .btn-accent{border-color:var(--verdigris); color:var(--verdigris-bright);}
  .btn-accent:hover:not(:disabled){background:rgba(92,138,104,.14);}
  .btn-danger{border-color:var(--danger); color:var(--danger-bright);}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 10px; font-size:12.5px; border-radius:4px;}

  .app-shell{min-height:calc(100% - var(--safe-t) - var(--safe-b)); display:flex;}

  /* ---------- Sidebar / nav ---------- */
  .sidebar{
    width:212px; flex:0 0 auto;
    background:var(--bg);
    border-right:1px solid var(--border-soft);
    display:flex; flex-direction:column;
    padding:18px 12px;
    position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 20px; border-bottom:1px solid var(--border-soft); margin-bottom:14px;}
  .brand-mark{width:30px; height:30px; flex:0 0 auto;}
  .brand-name{font-family:var(--font-display); font-size:17px; color:var(--parchment); font-weight:700; letter-spacing:.04em;}
  .navlist{display:flex; flex-direction:column; gap:3px; flex:1;}
  .navbtn{
    display:flex; align-items:center; gap:12px;
    padding:10px 12px; border-radius:4px;
    background:transparent; border:1px solid transparent;
    color:var(--text-dim); font-size:14px; font-weight:600; text-align:left;
  }
  .navbtn svg{width:18px; height:18px; flex:0 0 auto; stroke:currentColor;}
  .navbtn:hover{color:var(--text); background:var(--panel-2);}
  .navbtn.active{color:var(--brass-bright); background:rgba(185,138,62,.14); border-color:rgba(185,138,62,.4);}
  .nav-foot{font-size:11px; color:var(--text-faint); padding:10px 8px 2px; line-height:1.5;}

  /* ---------- Main / status bar ---------- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .statusbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:18px;
    padding:10px 20px; padding-top:calc(10px);
    background:rgba(26,31,35,.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border-soft);
    overflow-x:auto;
  }
  .sb-id{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
  .sb-avatar{
    width:34px; height:34px; border-radius:50%;
    background:var(--panel-2);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:13px; color:var(--brass-bright); font-weight:700;
    position:relative;
  }
  .sb-lvl-badge{
    position:absolute; bottom:-4px; right:-4px;
    background:var(--brass); color:#1a1f23; font-size:9px; font-weight:800;
    border-radius:8px; padding:1px 4px; border:1.5px solid var(--bg); line-height:1.3;
  }
  .sb-bars{display:flex; gap:12px; flex:1; min-width:280px;}
  .sb-bar{flex:1; min-width:70px;}
  .sb-bar-label{display:flex; justify-content:space-between; font-size:10px; color:var(--text-faint); margin-bottom:3px;}
  .sb-regen{color:var(--verdigris-bright); font-weight:700; font-size:9px;}
  .bar-track{height:7px; border-radius:4px; background:#100b07; border:1px solid var(--border-soft); overflow:hidden;}
  .bar-fill{height:100%; border-radius:4px;}
  .bar-hp{background:var(--danger);}
  .bar-energy{background:var(--brass);}
  .bar-mana{background:var(--arcane);}
  .sb-stat{flex:0 0 auto; text-align:right; font-size:12px;}
  .sb-stat b{color:var(--brass-bright); font-weight:700;}
  .sb-rating{flex:0 0 auto; display:flex; align-items:center; gap:6px; border:1px solid var(--verdigris); color:var(--verdigris-bright); padding:5px 10px; border-radius:20px; font-size:12px; font-weight:700;}

  .view{flex:1; padding:22px 26px 90px; max-width:1080px; width:100%; margin:0 auto;}

  .grid{display:grid; gap:14px;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  @media(max-width:780px){.grid-3{grid-template-columns:1fr;}}

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:16px;
    position:relative;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
  }
  .panel-title{font-family:var(--font-display); font-size:13.5px; color:var(--parchment); margin-bottom:10px; font-weight:600; letter-spacing:.03em;}

  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .muted{color:var(--text-dim);}
  .faint{color:var(--text-faint); font-size:12px;}
  .tag{display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:4px; border:1px solid var(--border); color:var(--text-dim);}
  .tag-common{border-color:#6b5a3a; color:#c2b192;}
  .tag-uncommon{border-color:var(--verdigris); color:var(--verdigris-bright);}
  .tag-rare{border-color:var(--brass); color:var(--brass-bright);}
  .tag-epic{border-color:#9b6fd1; color:#c5a3f0;}
  .tag-legendary{border-color:#e0913a; color:#ffb35c;}

  .stat-list{display:grid; grid-template-columns:1fr 1fr; gap:8px 18px; font-size:13px;}
  .stat-list div span{color:var(--text-dim);}
  .stat-list div b{float:right; color:var(--parchment);}

  /* class cards */
  .class-card{
    border:1px solid var(--border-soft); background:var(--panel); border-radius:6px;
    padding:14px; cursor:pointer; transition:border-color .15s, transform .1s;
  }
  .class-card:hover{border-color:var(--text-faint);}
  .class-card.selected{border-color:var(--brass); box-shadow:0 0 0 1px var(--brass) inset; background:var(--panel-2);}
  .class-card h3{font-size:16px; color:var(--parchment); margin-bottom:2px;}
  .class-card .res{font-size:11px; color:var(--verdigris-bright); margin-bottom:8px;}
  .class-card ul{margin:8px 0 0; padding-left:16px; font-size:12px; color:var(--text-dim);}

  input[type=text]{
    background:#11151a; border:1px solid var(--border); color:var(--text);
    padding:11px 13px; border-radius:4px; font-size:16px; width:100%;
    font-family:var(--font-body);
  }
  input[type=text]:focus{outline:none; border-color:var(--brass);}
  label.field{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:600;}

  /* zone list */
  .zone-card{display:flex; justify-content:space-between; align-items:center; padding:14px; border:1px solid var(--border-soft); border-radius:6px; background:var(--panel); margin-bottom:10px;}
  .zone-card.locked{opacity:.45;}
  .zone-card h4{font-size:15px; color:var(--parchment);}
  .zone-card .lvl{font-size:11.5px; color:var(--text-dim);}

  /* combat screen */
  .arena{display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:start; margin-bottom:16px;}
  @media(max-width:680px){.arena{grid-template-columns:1fr; }}
  .fighter{background:var(--panel); border:1px solid var(--border-soft); border-radius:6px; padding:14px;}
  .fighter.me{border-color:var(--verdigris);}
  .fighter.foe{border-color:var(--danger);}
  .fighter h4{font-size:15px; margin-bottom:2px;}
  .fighter .cls{font-size:11.5px; color:var(--text-dim); margin-bottom:10px;}
  .vs{align-self:center; font-family:var(--font-display); color:var(--text-faint); font-size:13px; font-weight:700; padding-top:40px; text-align:center;}
  .buff-row{display:flex; gap:5px; flex-wrap:wrap; margin-top:8px;}
  .buff-chip{font-size:10px; border:1px solid var(--verdigris); color:var(--verdigris-bright); padding:2px 6px; border-radius:4px;}

  .actions{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px;}
  @media(max-width:520px){.actions{grid-template-columns:repeat(2,1fr);}}
  .act-btn{padding:11px 8px; border-radius:4px; text-align:left; display:flex; flex-direction:column; gap:2px;}
  .act-btn .n{font-size:13px; font-weight:700;}
  .act-btn .d{font-size:10.5px; color:var(--text-dim); font-weight:400;}

  .log{background:#11151a; border:1px solid var(--border-soft); border-radius:6px; padding:12px 14px; height:150px; overflow-y:auto; font-size:12.5px; display:flex; flex-direction:column-reverse;}
  .log-line{padding:3px 0; border-bottom:1px dashed var(--border-soft); color:var(--text-dim);}
  .log-line b{color:var(--parchment);}
  .log-line.hit{color:var(--danger-bright);}
  .log-line.good{color:var(--verdigris-bright);}

  /* inventory */
  .inv-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
  .item-card{background:var(--panel); border:1px solid var(--border-soft); border-radius:5px; padding:10px; font-size:12px;}
  .item-card h5{font-size:13px; color:var(--parchment); margin-bottom:4px;}
  .eq-slots{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;}
  .eq-slot{background:var(--panel); border:1px dashed var(--border); border-radius:5px; padding:10px; min-height:74px; font-size:11.5px;}
  .eq-slot .slot-name{color:var(--text-faint); text-transform:capitalize; font-size:10.5px; margin-bottom:4px;}

  /* skills */
  .skill-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border-soft); gap:10px;}
  .skill-row:last-child{border-bottom:none;}
  .pip-row{display:flex; gap:3px; margin-top:4px;}
  .pip{width:14px; height:6px; border-radius:2px; background:#241b10; border:1px solid var(--border-soft);}
  .pip.on{background:var(--brass); border-color:var(--brass-bright);}

  .toast{
    position:fixed; bottom:calc(20px + var(--safe-b)); left:50%; transform:translateX(-50%);
    background:var(--panel-2); border:1px solid var(--brass); color:var(--brass-bright);
    padding:10px 18px; border-radius:5px; font-size:13px; font-weight:600; z-index:100;
    box-shadow:0 8px 24px rgba(0,0,0,.6); max-width:90vw; text-align:center;
  }
  @media (max-width:720px){ .toast{ bottom:calc(74px + var(--safe-b)); } }

  /* docked world chat, floats over every screen once a character exists */
  .chat-widget-toggle{
    position:fixed; right:20px; bottom:calc(20px + var(--safe-b)); z-index:90;
    width:48px; height:48px; border-radius:50%; padding:0;
    background:var(--panel-2); border:1px solid var(--brass); color:var(--brass-bright);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 8px 24px rgba(0,0,0,.6);
  }
  .chat-widget-toggle svg{width:22px; height:22px; stroke:currentColor;}
  .chat-widget-panel{
    position:fixed; right:20px; bottom:calc(20px + var(--safe-b)); z-index:90;
    width:300px; max-width:calc(100vw - 24px); max-height:min(60vh,420px);
    background:var(--panel-2); border:1px solid var(--border); border-radius:8px;
    display:flex; flex-direction:column; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.6);
  }
  .chat-widget-head{
    display:flex; justify-content:space-between; align-items:center; padding:9px 12px;
    border-bottom:1px solid var(--border-soft); font-family:var(--font-display);
    font-size:13px; font-weight:700; color:var(--brass-bright); letter-spacing:.03em;
  }
  .chat-widget-close{background:none; border:none; color:var(--text-dim); font-size:18px; line-height:1; cursor:pointer;}
  .chat-widget-panel .log{flex:1; height:auto; border-radius:0; border:none; margin:0;}
  .chat-widget-input-row{display:flex; gap:6px; padding:8px; border-top:1px solid var(--border-soft);}
  .chat-widget-input-row input{flex:1;}
  @media(max-width:720px){
    .chat-widget-toggle{ bottom:calc(84px + var(--safe-b)); }
    .chat-widget-panel{ bottom:calc(84px + var(--safe-b)); }
  }

  .empty{text-align:center; padding:40px 20px; color:var(--text-dim);}
  .empty h3{color:var(--parchment); margin-bottom:8px;}

  /* bottom nav mobile */
  .tabbar{display:none;}
  @media(max-width:720px){
    .sidebar{display:none;}
    .tabbar{
      display:flex; position:fixed; left:0; right:0; bottom:0; z-index:30;
      background:rgba(26,31,35,.96); backdrop-filter:blur(6px);
      border-top:1px solid var(--border-soft);
      padding-bottom:var(--safe-b);
    }
    .tabbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 2px 8px; color:var(--text-dim); background:none; border:none;}
    .tabbtn svg{width:19px; height:19px; stroke:currentColor;}
    .tabbtn span{font-size:9.5px; font-weight:600;}
    .tabbtn.active{color:var(--brass-bright);}
    .view{padding:14px 12px 84px;}

    /* status bar: tighter and wraps to two rows instead of scrolling off-screen */
    .statusbar{padding:8px 12px; gap:10px; flex-wrap:wrap;}
    .sb-id{gap:8px;}
    .sb-avatar{width:30px; height:30px; font-size:11px;}
    .sb-bars{gap:8px; min-width:0; order:3; flex-basis:100%;}
    .sb-bar{min-width:0;}
    .sb-stat, .sb-rating{font-size:11px; padding:5px 9px;}

    .panel{padding:12px;}
    .grid{gap:10px;}
    .stat-list{grid-template-columns:1fr; gap:6px;}

    /* Quick-action grid, home screen only — the sidebar nav this
       duplicates is hidden on mobile, so it's the fast path into the four
       most-used screens without opening the tabbar overflow. */
  }
  @media(max-width:480px){
    .view{padding:12px 10px 84px;}
    .eq-slots{grid-template-columns:repeat(2,1fr); gap:8px;}
    .craft-grid, .zone-grid{grid-template-columns:1fr;}
    .inv-grid{grid-template-columns:repeat(2,1fr);}
    .color-swatch-grid{grid-template-columns:repeat(3,1fr);}
  }

  .loader-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;}
  .loader-mark{width:54px; height:54px; opacity:.9; animation:spin 2.4s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loader-wrap p{color:var(--text-dim); font-size:13px; font-family:var(--font-display); letter-spacing:.1em;}
  .badge-win{color:var(--verdigris-bright); font-weight:700;}
  .badge-loss{color:var(--danger-bright); font-weight:700;}
  .badge-draw{color:var(--text-dim); font-weight:700;}

  /* crafting */
  .craft-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
  .craft-card{background:var(--panel); border:1px solid var(--border-soft); border-radius:6px; padding:14px;}
  .craft-icon{width:36px; height:36px; border-radius:5px; border:1px solid; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; font-family:var(--font-display); overflow:hidden;}
  .craft-icon img{width:100%; height:100%; object-fit:contain;}
  .item-icon{object-fit:contain; vertical-align:-3px; border-radius:3px;}
  .req-chip{font-size:11px; font-weight:600; padding:3px 8px; border-radius:4px; background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim); display:inline-flex; align-items:center; gap:4px;}
  .req-chip.short{border-color:var(--danger); color:var(--danger-bright);}
  .qty-stepper{display:flex; align-items:center; gap:6px; flex:0 0 auto;}
  .qty-stepper span{min-width:18px; text-align:center; font-weight:700; font-size:13px; color:var(--parchment);}

  /* appearance / color scheme picker */
  .color-swatch-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); gap:8px;}
  .color-swatch{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:10px 4px; border-radius:6px; border:1px solid var(--border-soft);
    background:var(--panel-2); color:var(--text-dim);
  }
  .color-swatch:hover{border-color:var(--text-faint); color:var(--text);}
  .color-swatch.selected{border-color:var(--swatch-color); box-shadow:0 0 0 1px var(--swatch-color) inset; color:var(--parchment);}
  .color-swatch-dot{width:20px; height:20px; border-radius:50%; border:1px solid rgba(0,0,0,.35); box-shadow:inset 0 1px 0 rgba(255,255,255,.25);}
  .color-swatch-label{font-size:10px; font-weight:600; text-align:center; line-height:1.2;}

  /* zone explorer */
  .zone-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px;}
  .zone-tile{border:1px solid var(--border-soft); border-radius:6px; overflow:hidden; background:var(--panel);}
  .zone-tile.locked{opacity:.55;}
  .zone-banner{height:100px; position:relative;}
  .zone-tile-body{padding:12px;}
  .zone-tile h4{font-size:14.5px; margin-bottom:6px;}
  .zone-tile-meta{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}

  /* kingdom dashboard */

/* ============================================================
   ARCADIA WORLD UI — full visual overhaul
   ============================================================ */
:root{
  --bg:#080b10; --bg-grad:#101a25; --panel:#111821; --panel-2:#151f29;
  --border:#283542; --border-soft:#1d2934;
  --brass:#3b82f6; --brass-bright:#60a5fa;
  --verdigris:#5fa878; --verdigris-bright:#83c397;
  --arcane:#7188d8; --arcane-bright:#9db0ef;
  --parchment:#e7e9ec; --text:#b4bec8; --text-dim:#7f8b97; --text-faint:#56616d;
  --danger:#c94b4b; --danger-bright:#e15e5e;
  
}
body{
  background:
    radial-gradient(900px 500px at 12% -12%,rgba(63,91,125,.20),transparent 60%),
    radial-gradient(800px 520px at 100% 8%,rgba(59,130,246,.07),transparent 60%),
    linear-gradient(145deg,#070a0e 0%,#0b1118 48%,#080c12 100%);
}

/* ---- theme.css ---- */
/* Flat dark theme (override layer) */
:root{
  --bg:#161a1d; --bg-grad:#161a1d; --panel:#1f2428; --panel-2:#272d32;
  --border:#333b42; --border-soft:#2a3137;
  --brass:#3b82f6; --brass-bright:#60a5fa;
  --verdigris:#22c55e; --verdigris-bright:#4ade80;
  --arcane:#3b82f6; --arcane-bright:#60a5fa;
  --parchment:#f1f5f9; --text:#cbd5e1; --text-dim:#94a3b8; --text-faint:#64748b;
  --danger:#dc2626; --danger-bright:#ef4444;
  --font-display:'Inter',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
}
body{background:var(--bg);}
h1,h2,h3,h4{letter-spacing:0;font-weight:700;}
.btn,.panel{border-radius:10px;}
.btn-primary{background:#3b82f6;border-color:#2563eb;color:#fff;text-shadow:none;}
.btn-primary:hover:not(:disabled){background:#60a5fa;}
.panel{background:var(--panel);border:1px solid var(--border);box-shadow:none;}
.sidebar,.statusbar,.tabbar{background:#1a1f23;border-color:var(--border);}
.bar-track{border-radius:99px;background:#11151a;}
.bar-fill{border-radius:99px;}

/* World: country grid */
.rc-countries{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px;}
.rc-country{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--text);text-align:left;}
.rc-country:hover{border-color:#3b82f6;}
.rc-country .fl{font-size:22px;}
.rc-country b{display:block;color:var(--parchment);font-size:13px;}
.rc-country small{color:var(--text-dim);font-size:11px;}
.rc-country.at-war{border-color:var(--danger);}

/* Profile hero */
.rc-avatar{width:72px;height:72px;border-radius:50%;background:#2b3238;border:3px solid #3b82f6;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;position:relative;flex:none;}
.rc-avatar i{position:absolute;bottom:-4px;right:-4px;background:#3b82f6;color:#fff;font-style:normal;font-size:11px;padding:2px 7px;border-radius:99px;}
.rc-chips{display:flex;gap:6px;flex-wrap:wrap;}
.rc-chip{background:#11151a;border:1px solid var(--border);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--text);}

/* Chat */
.chat-widget-panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:min(380px,100vw - 20px);}
.chat-widget-head{background:#1a1f23;border-radius:14px 14px 0 0;font-weight:700;}
.rc-chat-tabs{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);}
.rc-chat-tabs button{background:none;border:0;color:var(--text-dim);font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;}
.rc-chat-tabs button.on{background:#3b82f6;color:#fff;}
.rc-msg .bd b{color:var(--parchment);font-size:12.5px;}
.rc-msg .bd p{font-size:13px;color:var(--text);word-break:break-word;}

.chat-widget-panel{width:340px;max-height:min(70vh,520px);}
.rc-msg{display:flex;gap:10px;padding:8px 12px;align-items:flex-start;}
.rc-av{position:relative;width:40px;height:40px;flex:none;}
.rc-av .av{width:40px;height:40px;border-radius:50%;background:#2b3238;border:2px solid #3b82f6;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;}
.rc-av .lv{position:absolute;top:-4px;left:-4px;background:#16a34a;color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:99px;display:flex;align-items:center;justify-content:center;border:1px solid #161a1d;}
.rc-av .fg{position:absolute;bottom:-5px;left:-3px;width:20px;line-height:0;}
.rc-av .fg img{width:20px;height:auto;border-radius:3px;border:1px solid #161a1d;display:block;}
.rc-msg .bd b{font-size:13.5px;}
.rc-msg .bd p{font-size:13px;color:var(--text);word-break:break-word;margin-top:2px;}
.chat-badge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.chat-pop{position:fixed;right:20px;bottom:calc(84px + var(--safe-b));z-index:95;width:300px;max-width:calc(100vw - 24px);text-align:left;background:var(--panel);border:1px solid #3b82f6;border-radius:12px;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.5);animation:rcPop .25s ease-out;}
@keyframes rcPop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:720px){.chat-pop{bottom:calc(144px + var(--safe-b));}}

/* Country page */
.rc-chero{margin:-18px -18px 0;}
.rc-banner{height:120px;background:linear-gradient(180deg,#1b2a3a 0%,#2a3b4a 55%,#161a1d 100%);position:relative;}
.rc-banner:before,.rc-banner:after{content:"";position:absolute;top:0;bottom:0;width:36px;background:linear-gradient(90deg,#3a3f44,#5b6168,#3a3f44);opacity:.55;}
.rc-banner:before{left:12%;}.rc-banner:after{right:12%;}
.rc-chead{display:flex;gap:14px;align-items:flex-end;padding:0 18px;margin-top:-46px;position:relative;}
.rc-flag{width:116px;height:116px;background:#2a1517;border:2px solid #7f1d1d;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
.rc-flag img{width:94px;height:auto;margin:0!important;}
.rc-chead small{color:var(--text-dim);font-size:12px;}
.rc-chead h2{font-size:22px;margin:2px 0 8px;}
.rc-cstats{display:flex;gap:6px;flex-wrap:wrap;}
.rc-cstats span{background:rgba(220,38,38,.12);border:1px solid #7f1d1d;border-radius:6px;padding:3px 8px;}
.rc-cstats small{display:block;color:#f87171;font-size:10px;}
.rc-cstats b{font-size:13px;color:var(--parchment);}
.rc-cstats b.danger{color:#f87171;}.rc-cstats b.safe{color:#4ade80;}
.country-module-nav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--border);margin:12px 0;padding-bottom:0;background:none;border-left:0;border-right:0;border-top:0;}
.country-module{background:none!important;border:0!important;border-bottom:2px solid transparent!important;border-radius:0!important;color:var(--text-dim);font-size:11px;flex-direction:column;gap:3px;padding:8px 10px;box-shadow:none!important;min-width:64px;}
.country-module.active{color:#fff;border-bottom-color:#ef4444!important;background:rgba(239,68,68,.12)!important;}
.rc-sec{font-size:11px;letter-spacing:.08em;color:var(--text-dim);margin:16px 0 8px;font-weight:700;}
.rc-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
.rc-tile{background:#1f2428;border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.rc-tile small{display:block;color:var(--text-dim);font-size:11px;}.rc-tile b{font-size:18px;color:var(--parchment);}
.rc-tile.green{border-color:#166534;background:rgba(34,197,94,.08);}.rc-tile.green b{color:#4ade80;}
.rc-tile.gold{border-color:#854d0e;background:rgba(234,179,8,.08);}.rc-tile.gold b{color:#facc15;}
.rc-res{display:flex;gap:8px;flex-wrap:wrap;}
.rc-gov-strip{display:flex;gap:8px;}
.rc-gav{position:relative;width:52px;height:52px;border-radius:50%;background:#2b3238;border:2px solid #475569;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none;}
.rc-gav i{position:absolute;top:-5px;left:-5px;background:#7c3aed;color:#fff;font-style:normal;font-size:10px;min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;}
.rc-gav.gold{border-color:#eab308;}.rc-gav.blue{border-color:#60a5fa;}.rc-gav.red{border-color:#ef4444;}
.rc-gov-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.rc-role{border-radius:8px;padding:14px;text-align:center;border:1px solid var(--border);}
.rc-role h4{font-size:13px;margin-bottom:10px;}.rc-role p{color:var(--text-dim);font-size:12.5px;}
.rc-role.wide{grid-column:1/-1;}
.rc-role.gold{background:rgba(234,179,8,.08);border-color:#854d0e;}
.rc-role.blue{background:rgba(59,130,246,.1);border-color:#1e40af;}
.rc-role.red{background:rgba(239,68,68,.1);border-color:#7f1d1d;}
.rc-role-p{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0;}.rc-role-p b{color:var(--parchment);}
@media(max-width:600px){.rc-gov-grid{grid-template-columns:1fr;}}

/* Profile page */
.rc-phero .rc-chead{align-items:center;}
.rc-pav{position:relative;width:84px;height:84px;flex:none;}
.rc-pav .rc-avatar{width:84px;height:84px;font-size:26px;border-width:2px;border-color:#475569;}
.rc-pav .lv{position:absolute;bottom:-2px;left:-4px;background:#7c3aed;color:#fff;font-size:11px;font-weight:700;min-width:22px;height:22px;border-radius:99px;display:flex;align-items:center;justify-content:center;border:2px solid #161a1d;}
.rc-pav .fg{position:absolute;bottom:-8px;left:-4px;line-height:0;display:none;}
.rc-cstats.pl span{background:#1f2428;border-color:var(--border);}
.rc-cstats.pl small{color:var(--text-dim);}
.rc-ptabs .country-module{position:relative;}
.rc-dot{position:absolute;top:3px;right:6px;background:#ef4444;color:#fff;font-style:normal;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;}
.rc-skillhead{display:flex;align-items:center;gap:12px;margin:8px 0;}
.rc-lvl{width:44px;height:44px;border-radius:50%;border:3px solid #7c3aed;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;}
.rc-skills .skill-row{background:none;border:0;border-bottom:1px solid var(--border-soft);border-radius:0;padding:12px 0;align-items:center;}
.pip-row{display:flex;gap:3px;margin-top:8px;}
.pip{width:20px;height:26px;border-radius:4px;background:#232a30;border:1px solid var(--border);}
.pip.on{background:#3b82f6;border-color:#60a5fa;}
.color-swatch{border-radius:8px;}

/* Battles */
.rc-banner.war{background:linear-gradient(180deg,#3a1f14 0%,#2a2f36 60%,#161a1d 100%);}
.rc-banner.war:before,.rc-banner.war:after{display:none;}
.rc-filters{display:flex;gap:6px;margin:8px 0;background:#1a1f23;padding:6px;border-radius:8px;width:fit-content;}
.rc-fchip{background:none;border:0;color:var(--text-dim);font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:6px;}
.rc-fchip.on{background:#2b3238;color:#fff;}
.rc-battles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;}
.rc-battle{background:#1f2428;border:1px solid #2f4a52;border-radius:8px;padding:10px;color:var(--text);text-align:center;}
.rc-battle.you{border-color:#7f1d1d;background:rgba(127,29,29,.15);}
.rc-battle:hover{border-color:#3b82f6;}
.rc-b-top{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-dim);font-weight:700;letter-spacing:.06em;}
.rc-b-mid{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 4px;}
.rc-b-mid b{font-size:18px;color:#fff;}.rc-b-mid em{color:var(--text-dim);}
.rc-b-side{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;}
.rc-b-side small{font-size:10.5px;color:var(--text-dim);}
.rc-b-time{font-size:12px;color:#94a3b8;margin-bottom:8px;}
.rc-dmgbar{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;}
.rc-dmgbar div{flex:1;height:8px;background:#7f1d1d;border-radius:99px;overflow:hidden;}
.rc-dmgbar div i{display:block;height:100%;background:#0e7490;}
.rc-dmgbar .l{color:#67e8f9;}.rc-dmgbar .r{color:#fca5a5;}
.rc-dmgbar.big{font-size:15px;}.rc-dmgbar.big div{height:14px;}
.rc-ranks{display:flex;flex-direction:column;gap:6px;}
.rc-rank{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;background:rgba(59,130,246,.08);}
.rc-rank:nth-child(even){background:rgba(239,68,68,.08);}
.rc-rank>i{font-style:normal;width:18px;color:var(--text-dim);}
.rc-rank .rc-gav{width:38px;height:38px;font-size:12px;}
.rc-rank b{color:var(--parchment);flex:1;}
.rc-rank .dm{color:#fca5a5;font-weight:700;}

.rc-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.rc-two{grid-template-columns:1fr;}}
.rc-eqrow{display:flex;gap:8px;flex-wrap:wrap;}
.rc-eq{width:64px;height:64px;border-radius:8px;background:#1a1f23;border:1px dashed var(--border);color:var(--text-dim);font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.rc-eq small{font-size:9px;font-weight:600;text-transform:capitalize;}
.rc-eq[class*="tier-"]{border-style:solid;border-color:#3b82f6;color:#fff;}

/* Global rankings */
.rc-rrow{display:flex;align-items:center;gap:12px;padding:8px 12px;margin-bottom:6px;background:#1f2428;border:1px solid var(--border);border-radius:8px;}
.rc-rrow .rk{width:24px;text-align:center;font-weight:800;color:var(--text-dim);}
.rc-rrow .nm{flex:1;min-width:0;}.rc-rrow .nm b{display:block;color:var(--parchment);}.rc-rrow .nm small{color:var(--text-dim);font-size:11.5px;}
.rc-rrow .dm{color:#fca5a5;font-weight:700;white-space:nowrap;}
.rc-rrow.gold{border-color:#854d0e;background:rgba(234,179,8,.08);}.rc-rrow.gold .rk{color:#facc15;}
.rc-rrow.silver{border-color:#64748b;background:rgba(148,163,184,.08);}.rc-rrow.silver .rk{color:#cbd5e1;}
.rc-rrow.bronze{border-color:#9a3412;background:rgba(234,88,12,.08);}.rc-rrow.bronze .rk{color:#fb923c;}
.rc-rrow.me{outline:1px solid #3b82f6;}
.rc-cflag{width:40px;display:flex;justify-content:center;}

/* PvE / zones / PvP / combat */
.rc-banner.pve{background:linear-gradient(180deg,#14301f 0%,#22352d 60%,#161a1d 100%);}
.rc-banner.pvp{background:linear-gradient(180deg,#3b1217 0%,#2c2024 60%,#161a1d 100%);}
.rc-banner.pve:before,.rc-banner.pve:after,.rc-banner.pvp:before,.rc-banner.pvp:after{display:none;}
.zone-grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))!important;gap:10px!important;}
.zone-tile{background:#1f2428!important;border:1px solid var(--border)!important;border-radius:10px!important;overflow:hidden;}
.zone-tile:hover:not(.locked){border-color:#3b82f6!important;}
.zone-tile.locked{opacity:.55;filter:grayscale(.6);}
.zone-banner{height:84px;}
.zone-tile-body h4{color:var(--parchment);font-size:14px;}
.rc-zhero{height:170px;border-radius:12px;position:relative;overflow:hidden;background-size:cover!important;}
.rc-zov{position:absolute;left:16px;bottom:14px;right:16px;}
.rc-zov h2{font-size:24px;margin-bottom:6px;}
.rc-acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
.rc-act{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:10px;background:#1f2428;border:1px solid var(--border);color:var(--text);}
.rc-act .ai svg{width:22px;height:22px;}.rc-act b{color:var(--parchment);font-size:15px;}.rc-act small{color:var(--text-dim);font-size:12px;}
.rc-act em{font-style:normal;font-size:11px;font-weight:700;margin-top:4px;padding:2px 8px;border-radius:99px;background:#11151a;}
.rc-act.green{border-color:#166534;}.rc-act.green .ai{color:#4ade80;}
.rc-act.blue{border-color:#1e40af;}.rc-act.blue .ai{color:#60a5fa;}
.rc-act.red{border-color:#7f1d1d;background:rgba(127,29,29,.14);}.rc-act.red .ai{color:#f87171;}
.rc-act.gold{border-color:#854d0e;background:rgba(234,179,8,.08);}.rc-act.gold .ai{color:#facc15;}
.rc-act:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.15);}
.rc-act:disabled{opacity:.4;cursor:not-allowed;}
.rc-empty{text-align:center;padding:36px 16px;margin-top:14px;background:#1f2428;border:1px solid var(--border);border-radius:12px;}
.rc-empty .ei svg{width:38px;height:38px;color:#60a5fa;margin-bottom:8px;}
.rc-empty h3{margin-bottom:6px;}.rc-empty p{color:var(--text-dim);margin-bottom:14px;}
.rc-big{font-size:26px;font-weight:800;color:#facc15;}
.rc-opp{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px;background:#1f2428;border:1px solid var(--border);border-radius:10px;}
.rc-opp .nm{flex:1;min-width:0;}.rc-opp .nm b{display:block;color:var(--parchment);}.rc-opp .nm small{color:var(--text-dim);}
.rc-diff{font-weight:700;font-size:12px;padding:2px 8px;border-radius:99px;}
.rc-diff.up{background:rgba(239,68,68,.15);color:#f87171;}.rc-diff.down{background:rgba(34,197,94,.15);color:#4ade80;}
.fighter{background:#1f2428!important;border:1px solid var(--border)!important;border-radius:12px!important;}
.fighter.foe,.fighter.enemy{border-color:#7f1d1d!important;background:rgba(127,29,29,.12)!important;}
.fighter.me,.fighter.you{border-color:#1e40af!important;}
.fighter .bar-track{height:12px;}
.act-btn{background:#1f2428!important;border:1px solid var(--border)!important;border-radius:10px!important;}
.act-btn:hover:not(:disabled){border-color:#3b82f6!important;}
.badge-win{color:#4ade80;}.badge-loss{color:#f87171;}

/* ===== Global shell & remaining screens ===== */
.rc-banner.market{background:linear-gradient(180deg,#3a2f12 0%,#2c2d2a 60%,#161a1d 100%);}
.rc-banner.market:before,.rc-banner.market:after{display:none;}
.rc-chero{margin:-18px -18px 0;}
@media(max-width:720px){.rc-chero{margin:-18px -12px 0;}}

.tag{background:#11151a!important;border:1px solid var(--border)!important;color:var(--text)!important;border-radius:99px!important;}

.rc-wd-side{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;text-align:center;}
.rc-wd-side b{color:var(--parchment);}.rc-wd-side small{color:var(--text-dim);}
.rc-wd-score{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;}
.rc-wd-score strong{font-size:34px;color:#fff;}.rc-wd-score em{color:var(--text-dim);}
.rc-wd-score .rc-chip{flex-basis:100%;text-align:center;}

/* ===== Final pass: Kingdom (discover/economy/war/treasury/chat), combat, misc ===== */
.kingdom-discover-card,.court-row,.gov-person,.member-line,.kingdom-resource-row,.country-resources,.kingdom-chat-modern,.chat-compose,.treasury-list,.country-readiness,.your-role-main,.country-footer-action,.discover-hero,.country-overview-grid>*,.country-resource-grid>*,.country-actions>*,.qty-stepper,.world-history,.empty,.world-loading{background:#1f2428!important;background-image:none!important;border:1px solid var(--border)!important;border-radius:10px!important;box-shadow:none!important;}
.kingdom-discover-grid{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))!important;gap:10px!important;}
.kingdom-discover-card:hover{border-color:#3b82f6!important;}
.kingdom-discover-foot{border-top:1px solid var(--border-soft)!important;background:none!important;}
.kingdom-discover-title h3{color:var(--parchment);}
.member-avatar,.court-avatar,.gov-person-avatar,.role-symbol{background:#2b3238!important;border:2px solid #475569!important;border-radius:50%!important;color:#fff!important;box-shadow:none!important;}
.kingdom-crest,.treasury-emblem,.hero-emblem,.country-empty-icon{background:#272d32!important;border:1px solid var(--border)!important;border-radius:12px!important;color:#60a5fa!important;box-shadow:none!important;}
.country-empty{background:none!important;border:0!important;color:var(--text-dim)!important;}
.country-empty h2{color:var(--parchment);}
.country-alert{background:rgba(234,179,8,.08)!important;border:1px solid #854d0e!important;border-radius:10px!important;color:var(--text)!important;}
.country-alert b{color:#facc15;}
.country-hero{background:#1f2428!important;background-image:none!important;border:1px solid var(--border)!important;border-radius:12px!important;}
.member-actions .btn,.country-actions .btn{border-radius:8px;}
.member-line{margin-bottom:6px;}
.section-head h3{color:var(--parchment);}
.chat-compose input{background:#11151a!important;}
.kingdom-chat-modern .msg,.kingdom-chat-modern .log-line{background:none!important;}
.slot-name{color:var(--text-dim);}

/* Combat arena */
.arena{background:#161a1d!important;background-image:none!important;border:1px solid var(--border)!important;border-radius:14px!important;padding:14px!important;box-shadow:none!important;}
.vs{color:#ef4444!important;font-family:var(--font-display)!important;font-weight:800!important;text-shadow:none!important;}
.actions{gap:8px!important;}
.act-btn{color:var(--parchment)!important;font-weight:600;}
.act-btn:disabled{opacity:.4;}
.buff-chip{background:#11151a!important;border:1px solid var(--border)!important;border-radius:99px!important;color:var(--text)!important;box-shadow:none!important;}
.buff-chip.debuff{border-color:#7f1d1d!important;color:#fca5a5!important;}
.badge-draw{color:#facc15;}
.log-line{border-color:var(--border-soft)!important;}

/* Settings / misc */
.color-swatch-grid{gap:8px!important;}
.color-swatch-label{color:var(--text)!important;}
.field{color:var(--text-dim)!important;font-size:11px;letter-spacing:.08em;text-transform:uppercase;}
.btn-danger{background:#dc2626!important;border-color:#b91c1c!important;color:#fff!important;}
.btn-accent{background:#2b3238!important;border:1px solid var(--border)!important;color:#fff!important;}
.btn-accent:hover:not(:disabled){border-color:#3b82f6!important;}
.btn{font-family:var(--font-body)!important;font-weight:600;text-transform:none!important;letter-spacing:0!important;}
.icon-btn{background:#272d32!important;border:1px solid var(--border)!important;border-radius:8px!important;color:var(--text)!important;}
svg{stroke-width:1.8;}
.chat-widget-toggle{background:#3b82f6!important;border:0!important;color:#fff!important;box-shadow:0 4px 14px rgba(0,0,0,.45)!important;}
.chat-widget-input-row{background:#1a1f23!important;border-top:1px solid var(--border)!important;}
.chat-widget-close{color:var(--text-dim)!important;}
.news-list,.war-feed{background:none!important;}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#333b42;border-radius:99px}::-webkit-scrollbar-track{background:transparent}

.rc-fcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.rc-fh{font-size:12px;font-weight:700;color:var(--text-dim);margin-bottom:6px;}
@media(max-width:600px){.rc-fcols{grid-template-columns:1fr;}}

/* Chat v2: channels, grouped messages, citizens panel */
.rc-chatpanel{width:370px;height:min(74vh,560px);max-height:none;}
.rc-ch-head{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--border);background:#1a1f23;}
.rc-ch-head b{display:block;color:#fff;font-size:14px;}.rc-ch-head small{color:var(--text-dim);font-size:11.5px;}
.rc-chat-tabs button{position:relative;display:inline-flex;align-items:center;}
.rc-chat-tabs button:disabled{opacity:.4;cursor:not-allowed;}
.rc-chat-tabs .rc-dot{position:static;margin-left:6px;}
.rc-mstrip{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--border-soft);background:#1a1f23;overflow:hidden;}
.rc-mmore{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:#272d32;border:1px solid var(--border);color:var(--text);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:99px;white-space:nowrap;}
.rc-mmore svg{width:13px;height:13px;}.rc-mmore.on,.rc-mmore:hover{border-color:#3b82f6;color:#fff;}
.rc-gav.sm{width:28px;height:28px;font-size:10px;border-width:2px;opacity:.55;flex:none;}.rc-gav.sm.on{opacity:1;}
.rc-gav.on{border-color:#4ade80;}
.dot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#475569;border:2px solid #1f2428;}
.dot.on{background:#22c55e;}
.rc-chatpanel .log.plain{padding:6px 10px;}
.rc-mpanel{width:100%;}.rc-mrow{display:flex;align-items:center;gap:10px;padding:6px 4px;}
.rc-mrow .rc-gav{width:36px;height:36px;font-size:12px;}
.rc-mrow .nm{flex:1;min-width:0;}.rc-mrow .nm b{display:block;color:var(--parchment);font-size:13px;}.rc-mrow .nm small{color:var(--text-dim);font-size:11px;}
.rl{display:inline-flex;color:#facc15;}.rl svg{width:13px;height:13px;}
.rc-msg .who{display:flex;align-items:baseline;gap:6px;}
.rc-msg .who time{margin-left:auto;font-size:10.5px;color:var(--text-faint);}
.rc-msg.cont{padding-top:0;}.rc-msg .rc-sp{width:40px;flex:none;}
.rc-msg.mine .bd p{color:#e2e8f0;}
.rc-msg.mine .rc-av .av{border-color:#22c55e;}
.chat-widget-input-row input{flex:1;}
@media(max-width:600px){.rc-chatpanel{width:calc(100vw - 16px);height:min(72vh,540px);}}

/* read-only profiles */
.rc-card{background:#1f2428;border:1px solid var(--border);border-radius:8px;padding:6px 10px;margin-bottom:6px;}
.rc-card:hover,.rc-opp[data-action]:hover,.rc-rank[data-action]:hover,.rc-rrow[data-action]:hover{border-color:#3b82f6;}
[data-action="view-player"],[data-action="view-country"]{cursor:pointer;}
.rc-chead small .rc-chip{margin-left:8px;font-size:10.5px;}

/* clickable avatars */
.rc-gav[data-action],.member-avatar[data-action],.rc-av[data-action],.rc-avatar[data-action]{cursor:pointer;transition:transform .12s,box-shadow .12s;}
.rc-gav[data-action]:hover,.member-avatar[data-action]:hover,.rc-av[data-action]:hover{transform:scale(1.08);box-shadow:0 0 0 3px rgba(59,130,246,.45);}
.rc-rank[data-action],.rc-rrow[data-action],.rc-mrow[data-action],.rc-opp[data-action],.row[data-action]{cursor:pointer;}

.rc-search{width:100%;margin:6px 0 10px;padding:10px 12px;font-size:14px;}
.rc-country.mine{border-color:#3b82f6;background:rgba(59,130,246,.1);}
.rc-country em{font-style:normal;color:#60a5fa;font-weight:600;font-size:11px;}
.rc-shortcuts{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap;}
.rc-shortcuts .btn{display:inline-flex;align-items:center;gap:6px;}
.rc-shortcuts svg{width:14px;height:14px;}

/* Inventory v2 */
.rc-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.rc-item{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:12px;background:#1f2428;border:1px solid var(--border);border-top:3px solid var(--rar,#475569);border-radius:10px;}
.rc-item:hover{border-color:var(--rar,#3b82f6);}
.rc-item.empty{border-style:dashed;border-top:1px dashed var(--border);opacity:.65;align-items:center;text-align:center;}
.rc-item.eq{background:linear-gradient(180deg,rgba(59,130,246,.06),#1f2428);}
.rc-slotname{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);font-weight:700;}
.rc-ibox{position:relative;width:54px;height:54px;border-radius:10px;background:#11151a;border:2px solid var(--rar,#333b42);display:flex;align-items:center;justify-content:center;color:var(--rar,#64748b);margin:2px 0;}
.rc-ibox svg{width:26px;height:26px;}
.rc-ibox .q{position:absolute;right:-6px;bottom:-6px;background:#272d32;border:1px solid var(--border);border-radius:99px;font-size:10.5px;padding:1px 6px;color:#fff;}
.rc-ibox .lv{position:absolute;top:-6px;left:-6px;background:#7c3aed;color:#fff;font-style:normal;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;}
.rc-iname{font-weight:700;font-size:13px;color:var(--parchment);line-height:1.2;}
.rc-tier{align-self:flex-start;font-size:10.5px;font-weight:700;text-transform:capitalize;color:var(--rar);background:rgba(255,255,255,.04);border:1px solid var(--rar);border-radius:99px;padding:1px 8px;}
.rc-chips2{display:flex;flex-wrap:wrap;gap:4px;}
.rc-st{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:#11151a;border:1px solid var(--border);color:var(--text);}
.rc-st.s-atk{color:#f87171;border-color:#7f1d1d;}.rc-st.s-def{color:#60a5fa;border-color:#1e40af;}.rc-st.s-hp{color:#4ade80;border-color:#166534;}
.rc-st.s-spd{color:#22d3ee;border-color:#155e75;}.rc-st.s-eva{color:#c084fc;border-color:#6b21a8;}.rc-st.s-crit{color:#facc15;border-color:#854d0e;}
.rc-iact{display:grid;gap:6px;margin-top:auto;padding-top:4px;}
.rc-iact .btn{width:100%;justify-content:center;white-space:normal;line-height:1.15;}
.rc-bagbar{height:6px;border-radius:99px;background:#11151a;margin-top:6px;overflow:hidden;}.rc-bagbar i{display:block;height:100%;background:#3b82f6;}

/* War taxes on country Home */
.rc-tax{background:#1f2428;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.rc-tax.won{border-color:#166534;background:rgba(34,197,94,.07);}
.rc-tax.lost{border-color:#7f1d1d;background:rgba(239,68,68,.08);}
.rc-tax.pending{border-style:dashed;}
.rc-tax-h{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--text-dim);margin-bottom:8px;}
.rc-tax.won .tt{color:#4ade80;}.rc-tax.lost .tt{color:#f87171;}
.rc-tax-b{display:flex;align-items:center;gap:10px;cursor:pointer;}
.rc-tax-b b{display:block;color:var(--parchment);}.rc-tax-b small{color:var(--text-dim);display:inline-flex;align-items:center;gap:4px;}
.rc-tax-f{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-soft);font-size:12.5px;color:var(--text-dim);}
.rc-tax-f b{color:#fff;}

.rc-range{width:100%;accent-color:#3b82f6;margin-top:6px;}
.rc-range-lim{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);}

/* Page header banners — custom artwork (icons/banners/banner-*.png). The dark fade at the bottom keeps the title readable. */
.rc-banner.home,.rc-banner.craft,.rc-banner.inventory,.rc-banner.market,.rc-banner.pve,.rc-banner.rankings,.rc-banner.war,.rc-banner.country,.rc-banner.pvp{background-size:cover;background-position:center;background-repeat:no-repeat;}
.rc-banner.home:before,.rc-banner.home:after,.rc-banner.craft:before,.rc-banner.craft:after,.rc-banner.inventory:before,.rc-banner.inventory:after,.rc-banner.rankings:before,.rc-banner.rankings:after,.rc-banner.country:before,.rc-banner.country:after{display:none;}
.rc-banner.home{background-image:linear-gradient(180deg,rgba(22,26,29,.1) 0%,rgba(22,26,29,.45) 60%,#161a1d 100%),url(icons/banners/banner-home.webp);}
.rc-banner.craft{background-image:linear-gradient(180deg,rgba(22,26,29,.1) 0%,rgba(22,26,29,.45) 60%,#161a1d 100%),url(icons/banners/banner-crafting.webp);}
.rc-banner.inventory{background-image:linear-gradient(180deg,rgba(22,26,29,.1) 0%,rgba(22,26,29,.45) 60%,#161a1d 100%),url(icons/banners/banner-inventory.webp);}
.rc-banner.market{background-image:linear-gradient(180deg,rgba(22,26,29,.1) 0%,rgba(22,26,29,.45) 60%,#161a1d 100%),url(icons/banners/banner-market.webp);}
.rc-banner.pve{background-image:linear-gradient(180deg,rgba(22,26,29,.1) 0%,rgba(22,26,29,.45) 60%,#161a1d 100%),url(icons/banners/banner-explorer.webp);}
.rc-banner.rankings{background-image:linear-gradient(180deg,rgba(22,26,29,.1) 0%,rgba(22,26,29,.45) 60%,#161a1d 100%),url(icons/banners/banner-rankings.webp);}
.rc-banner.war{background-image:linear-gradient(180deg,rgba(22,26,29,.1) 0%,rgba(22,26,29,.45) 60%,#161a1d 100%),url(icons/banners/banner-battles.webp);}
.rc-banner.country{background-image:linear-gradient(180deg,rgba(22,26,29,.1) 0%,rgba(22,26,29,.45) 60%,#161a1d 100%),url(icons/banners/banner-country.webp);}
.rc-banner.pvp{background-image:linear-gradient(180deg,rgba(22,26,29,.1) 0%,rgba(22,26,29,.45) 60%,#161a1d 100%),url(icons/banners/banner-pvp.webp);}

/* weapon pictures (icons/gear/weapon_*.png) */
.rc-ibox.has-art{width:68px;height:68px;padding:3px;background:#11151a;}
.rc-ibox .rc-art{width:100%;height:100%;object-fit:contain;border-radius:8px;display:block;}
.rc-ibox.has-art .fb svg{width:26px;height:26px;}

/* System lines in the country chat (war news, leadership changes) */
.rc-sys{margin:6px 12px;padding:5px 10px;border-radius:8px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);color:#fcd34d;font-size:12px;text-align:center;}
/* Daily reward */
.daily-panel{margin:10px 0;}
.daily-streak{display:flex;gap:6px;margin-top:8px;}
.daily-dot{flex:1;text-align:center;padding:6px 0;border-radius:8px;border:1px solid var(--border,#2a3038);background:rgba(255,255,255,.03);font-size:12px;font-weight:700;color:#8b97a5;}
.daily-dot.done{background:rgba(34,197,94,.16);border-color:#22c55e;color:#86efac;}
.daily-dot.next{border-color:#f59e0b;color:#fcd34d;}

/* PvP leagues */
.lg-badge{display:inline-flex;align-items:center;justify-content:center;flex:none;vertical-align:middle;border-radius:28% 28% 50% 50%/18% 18% 62% 62%;background:linear-gradient(160deg,var(--lg),rgba(0,0,0,.5));border:2px solid var(--lg);color:#0b0f14;font-weight:800;line-height:1;}
.lg-panel{display:flex;align-items:center;gap:12px;margin:10px 0 4px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--border,#2a3038);}
.lg-panel .lg-main{flex:1;min-width:0;}
.lg-panel small{display:block;color:#8b97a5;}

/* XP ring around the avatar + hover card */
.sb-xp{--p:0;flex:none;width:40px;height:40px;padding:3px;box-sizing:border-box;border-radius:50%;background:conic-gradient(#a78bfa calc(var(--p)*1%),#2b3238 0);display:flex;align-items:center;justify-content:center;cursor:pointer;}
@media(max-width:720px){.sb-xp{width:36px;height:36px;}}
.xp-card{position:fixed;z-index:9999;width:250px;padding:14px;border-radius:12px;background:#1f2428;border:1px solid #333b42;box-shadow:0 12px 32px rgba(0,0,0,.55);color:#e5e7eb;font-size:12px;}
.xp-card-title{font-size:16px;font-weight:800;color:#fff;}
.xp-card-sub{color:#8b97a5;margin:2px 0 10px;}
.xp-card-bar{position:relative;height:18px;border-radius:99px;}
.xp-card-bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;}
.xp-card-left{margin:6px 0 10px;color:#c4b5fd;font-size:11px;text-align:center;}
.xp-card-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:8px;margin-top:8px;border-top:1px solid #2a3137;color:#8b97a5;}
.xp-card-row b{color:#e5e7eb;}

/* equipment slot art in the character/profile row */
.rc-eq .rc-eq-art{width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
.rc-eq .rc-eq-art .rc-art{width:100%;height:100%;object-fit:contain;display:block;}
.rc-eq svg{width:22px;height:22px;stroke:currentColor;}
.rc-eq .rc-eq-art .fb svg{width:22px;height:22px;stroke:currentColor;}

@media(max-width:720px){.rc-flag{width:96px;height:96px;}.rc-flag img{width:76px;}}

/* Market: item pictures in listings and in the sell picker */
.mk-ico{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-right:8px;border-radius:8px;background:#11151a;border:1px solid var(--border);flex:none;}
.mk-ico .rc-art{width:100%;height:100%;object-fit:contain;display:block;padding:2px;box-sizing:border-box;}
.mk-ico svg{width:60%;height:60%;stroke:currentColor;color:#94a3b8;}
.mk-ico .item-icon{vertical-align:middle;}
.mk-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px;max-height:260px;overflow-y:auto;}
.mk-pick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;border-radius:10px;background:#171c20;border:1px solid var(--border);color:var(--text);cursor:pointer;text-align:center;}
.mk-pick .mk-ico{margin-right:0;}
.mk-pick-name{font-size:12.5px;font-weight:700;line-height:1.2;}
.mk-pick small{color:var(--text-dim);font-size:11px;}
.mk-pick:hover{border-color:#3b82f6;}
.mk-pick.on{border-color:#3b82f6;background:rgba(59,130,246,.12);box-shadow:0 0 0 1px #3b82f6 inset;}


/* ===== Mobile side drawer (pill) — replaces bottom tabbar on phones ===== */
.mdrawer{display:none;}
@media(max-width:720px){
  .tabbar{display:none!important;}
  .view{padding-bottom:24px!important;}
  .toast{bottom:calc(16px + var(--safe-b));}
  .chat-widget-toggle,.chat-widget-panel{bottom:calc(16px + var(--safe-b));}
  .chat-pop{bottom:calc(76px + var(--safe-b));}
  .mdrawer{display:block;position:fixed;inset:0;z-index:40;pointer-events:none;}
  .md-dim{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .2s;}
  .mdrawer.open .md-dim{opacity:.45;pointer-events:auto;}
  .md-wrap{position:absolute;left:0;top:calc(64px + env(safe-area-inset-top,0px));display:flex;align-items:flex-start;transform:translateX(-72px);transition:transform .25s ease-out;}
  .mdrawer.open .md-wrap{transform:none;}
  .md-pill{pointer-events:auto;width:64px;margin-left:8px;max-height:calc(100dvh - 96px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;scrollbar-width:none;background:var(--panel);border:1.5px solid var(--brass);border-radius:32px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .md-pill::-webkit-scrollbar{display:none;}
  .md-btn{position:relative;width:60px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0;background:none;border:0;color:var(--text-dim);cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .md-ic{width:38px;height:38px;border-radius:50%;background:var(--panel-2);display:grid;place-items:center;}
  .md-ic svg{width:21px;height:21px;stroke:currentColor;}
  .md-lb{font-size:10px;font-weight:600;line-height:1.2;}
  .md-btn.active{color:#fff;}
  .md-btn.active .md-ic{background:var(--brass);}
  .md-btn .nav-count{position:absolute;top:-2px;right:2px;margin:0;min-width:16px;height:16px;font-size:9px;}
  .md-handle{pointer-events:auto;width:28px;height:60px;margin-top:90px;padding:0;background:var(--brass);color:#fff;border:0;border-radius:0 12px 12px 0;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .md-handle span{font-size:26px;line-height:1;display:block;transition:transform .25s;}

/* Icon folders: icons/<folder>/<file>.webp (code may still say .png/.jpg: iconUrl() maps it to .webp). iconUrl() picks the folder from the file name, so the rest of the code keeps using plain file names. */
function iconUrl(file){
  const f = String(file||'');
  let d = 'ui';
  if(/^(weapon|armor|helmet|gloves|boots|accessory)_/i.test(f)) d = 'gear';
  else if(/^resource_/i.test(f)) d = 'resources';
  else if(/^monster_/i.test(f)) d = 'monsters';
  else if(/^zone/i.test(f)) d = 'zones';
  else if(/^banner-/i.test(f)) d = 'banners';
  else if(/^class_/i.test(f)) d = 'classes';
  return 'icons/' + d + '/' + f.replace(/\.(png|jpe?g)$/i, '.webp');
}
function itemIcon(file, size, extra){ return file ? `<img src="${iconUrl(file)}" alt="" class="item-icon" style="width:${size||16}px;height:${size||16}px;${extra||''}">` : ''; }

const WEAPON_TIER_ART = ['common','uncommon','rare','epic','legendary'];
function weaponArtKey(it){
  if(!it) return null;
  if(it.slot==='weapon'){
    if(WEAPON_ART[it.name]) return WEAPON_ART[it.name];
    return 'weapon_' + (WEAPON_TIER_ART.includes(it.tier) ? it.tier : 'common');
  }
  // armor / helmet / gloves / boots / accessory: icons/gear/<slot>_<rarity>.png
  if(['armor','helmet','gloves','boots','accessory'].includes(it.slot)){

function marketIcon(kind, itemId, gear, size){

function leagueOf(rating){
  const r = Number(rating) || 0;
  let cur = LEAGUES[0];
  for(const l of LEAGUES) if(r >= l.min) cur = l;
  return cur;
}
// Where the player stands inside their league: { league, next (or null), pct (0-100), toNext }
function leagueProgress(rating){
  const r = Math.round(Number(rating) || 0), league = leagueOf(r), i = LEAGUES.indexOf(league), next = LEAGUES[i+1] || null;
  if(!next) return { league, next:null, pct:100, toNext:0 };
  const start = league.min === 0 ? 900 : league.min; // Bronze starts at 0, but its bar starts at 900 so a new player (1000) isn't shown as "almost done"
  return { league, next, pct: clamp(Math.round((r - start) / (next.min - start) * 100), 0, 100), toNext: next.min - r };

function kingdomFlag(kingdomId, size, extra){ const k = KINGDOMS.find(x=>x.id===kingdomId); return k ? flagIcon(k.flag, size||14, 'margin-right:4px;vertical-align:-2px;'+(extra||'')) : ''; }
function flagIcon(code, size, extra){
  if(!code) return '';
  const k = KINGDOMS.find(x=>x.flag===code);
  const fb = `https://flagcdn.com/w40/${code}.png`;
  const first = k ? `icons/flags/${k.id}.webp` : fb;
  return `<img src="${first}" alt="${code.toUpperCase()}" class="item-icon" style="width:${size||16}px;height:auto;${extra||''}" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='${fb}';}">`;
}

function pickTierForBoss(zone){
  const pool = zone.dropTable.slice(-2);
  const total = pool.reduce((a,x)=>a+x.w, 0) || 1;
  let r = rnd(0, total);
  for(const x of pool){ if(r<x.w) return TIERS.find(t=>t.id===x.t); r-=x.w; }
  return TIERS.find(t=>t.id===pool[pool.length-1].t);
}
function pickTierForZone(zone, elite){
  let table = zone.dropTable.map(x=>Object.assign({},x));
  if(elite){
    table = table.map(x=>{
      if(x.t==='common') return {t:x.t, w:Math.max(1, Math.round(x.w*0.35))};
      if(x.t==='epic' || x.t==='legendary') return {t:x.t, w:Math.round(x.w*1.8)};
      return x;
    });
  }
  const total = table.reduce((a,x)=>a+x.w, 0);
  let r = rnd(0, total);
  for(const x of table){ if(r<x.w) return TIERS.find(t=>t.id===x.t); r-=x.w; }
  return TIERS.find(t=>t.id===table[0].t) || TIERS[0];
}

function rnd(min,max){ return Math.random()*(max-min)+min; }
function rndInt(min,max){ return Math.floor(rnd(min,max+1)); }
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function pick(arr){ return arr[rndInt(0, arr.length-1)]; }
function uid(){ return 'x'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtNum(n){ return Math.round(n).toLocaleString('en-US'); }
function fmtDmg(n){ // compact: 950 / 12.3K / 3.85M / 1.2B
  n = Math.round(Number(n)||0); const a = Math.abs(n);
  if(a >= 1e9) return (n/1e9).toFixed(2).replace(/\.?0+$/,'')+'B';
  if(a >= 1e6) return (n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';
  if(a >= 1e4) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K';
  return n.toLocaleString('en-US');
}
function plural(n, one, many){ return n+' '+(n===1?one:(many||one+'s')); }
function fmtMs(ms){
  if(ms<=0) return '0:00';
  if(ms>=3600000){ // an hour or more: days / hours / minutes instead of a huge M:SS
    const t = Math.floor(ms/60000), d = Math.floor(t/1440), h = Math.floor(t%1440/60), mi = t%60;
    return (d?d+'d ':'')+((d||h)?h+'h ':'')+mi+'m';
  }
  const s = Math.ceil(ms/1000);
  const m = Math.floor(s/60), r = s%60;
  return m+':'+String(r).padStart(2,'0');
}

function newCharacter(id, username, classId){
  const cls = CLASSES[classId];
  const now = Date.now();
  const c = {
    id, username, class: classId, level:1, xp:0,
    colorScheme: 'brass',
    gold:150,
    hpCur: cls.base.hp, energyCur:100, resourceCur:0, manaCur:20,
    generalSkills:{health:0,damage:0,defense:0,stamina:0,storage:0},
    classSkills:{}, skillPoints:0,
    equipment:{weapon:null,armor:null,helmet:null,boots:null,gloves:null,accessory:null},
    inventory:[],
    resourceBag:{wood:0,stone:0,food:0,coal:0,iron:0,ore:0,herbs:0,leather:0,frost:0,voidessence:0},
    pvp:{rating:1000, wins:0, losses:0, protectedUntil:0},
    bossCooldowns:{},
    kingdomId:null, kingdomRole:null, kingdomJoinedAt:0, kingdomCooldownUntil:0,
    lastEnergyAt: now, lastHpAt: now, lastManaAt: now,
    createdAt: now, updatedAt: now,
  };
  cls.skills.forEach(s=> c.classSkills[s.id]=0);
  // starting equipment (crude, weak, non-tiered "starter" gear)
  const w = makeEquipment('weapon', 'common', 1); w.name = cls.startEq.weapon; w.starter=true;
  const a = makeEquipment('armor', 'common', 1); a.name = cls.startEq.armor; a.starter=true;
  c.equipment.weapon = w; c.equipment.armor = a;
  return c;
}

/* Gear stats are RANDOM: each stat rolls between a min and a max. Every tier has its own roll range (tiers never overlap). */
const SLOT_STAT_COEF = {
  weapon:{atk:1.3}, armor:{def:0.85, hp:3}, helmet:{def:0.55, hp:1.4},
  boots:{spd:0.5, eva:0.3}, gloves:{atk:0.45, crit:0.22}, accessory:{crit:0.35, eva:0.35},
};
const TIER_ROLL = { common:[0.85,1.15], uncommon:[1.2,1.5], rare:[1.6,2.0], epic:[2.1,2.7], legendary:[2.9,3.7] };
function equipmentStatRange(slot, tierId, level){
  const base = 3 + level*1.4, roll = TIER_ROLL[tierId] || TIER_ROLL.common, out = {};
  Object.entries(SLOT_STAT_COEF[slot]||{}).forEach(([k,co])=>{
    out[k] = [Math.max(1, Math.round(base*co*roll[0])), Math.max(1, Math.round(base*co*roll[1]))];
  });
  return out;
}
function makeEquipment(slot, tierId, level){
  const tier = TIERS.find(t=>t.id===tierId) || TIERS[0];
  const stats = {};
  Object.entries(equipmentStatRange(slot, tier.id, level)).forEach(([k,[lo,hi]])=>{ stats[k] = Math.floor(Math.random()*(hi-lo+1))+lo; });
  return { uid: uid(), kind:'equipment', slot, tier: tier.id, name: tier.name + ' ' + SLOT_NOUN[slot], level, stats };
}

function xpNeeded(level){ return XP_FOR_LEVEL(level); }

function effectiveStats(c){
  const cls = CLASSES[c.class];
  const lvl = c.level;
  let hp = cls.base.hp + cls.growth.hp*(lvl-1) + c.generalSkills.health*8;
  let atk = cls.base.atk + cls.growth.atk*(lvl-1) + c.generalSkills.damage*2;
  let def = cls.base.def + cls.growth.def*(lvl-1) + c.generalSkills.defense*2;
  let spd = cls.base.spd + cls.growth.spd*(lvl-1);
  let crit = cls.base.crit + cls.growth.crit*(lvl-1);
  let eva = cls.base.eva + cls.growth.eva*(lvl-1);
  EQUIP_SLOTS.forEach(slot=>{
    const it = c.equipment[slot];
    if(it && it.stats){
      hp += it.stats.hp||0; atk += it.stats.atk||0; def += it.stats.def||0;
      spd += it.stats.spd||0; crit += it.stats.crit||0; eva += it.stats.eva||0;
    }
  });
  const maxEnergy = 100 + c.generalSkills.stamina*6;
  const maxMana = c.class==='mage' ? (20 + lvl*4) : (20 + Math.floor(lvl*0.5));
  const resourceMax = c.class==='mage' ? maxMana : 100;
  const storageCap = 500 + c.generalSkills.storage*40;
  return {
    maxHp: Math.round(hp), atk: Math.round(atk), def: Math.round(def),
    spd: Math.round(spd*10)/10, crit: Math.round(crit*10)/10, eva: Math.round(eva*10)/10,
    maxEnergy: Math.round(maxEnergy), maxMana: Math.round(maxMana),
    resourceMax: Math.round(resourceMax), storageCap: Math.round(storageCap),
  };
}

function bagCount(c){ return c.inventory.length; }
function resourceTotal(c){ return Object.values(c.resourceBag).reduce((a,b)=>a+b,0); }

function applyRegen(c){
  const now = Date.now();
  const eff = effectiveStats(c);
  // Energy: continuous, timestamp-based regen at ENERGY_REGEN_RATE_PER_HOUR of Max Energy
  // per hour. Computed from elapsed real time (not a fixed tick), so it accrues correctly
  // no matter how long the game was closed, and never exceeds maxEnergy.
  const elapsedMs = Math.max(0, now - c.lastEnergyAt);
  if(elapsedMs > 0){
    const gained = elapsedMs * (ENERGY_REGEN_RATE_PER_HOUR * eff.maxEnergy) / (60*60*1000);
    c.energyCur = clamp(c.energyCur + gained, 0, eff.maxEnergy);
    c.lastEnergyAt = now;
  }
  const hTicks = Math.floor((now - c.lastHpAt) / HP_REGEN_MS);
  if(hTicks>0){ c.hpCur = clamp(c.hpCur + hTicks*Math.max(1,Math.round(eff.maxHp*HP_REGEN_PCT)), 0, eff.maxHp); c.lastHpAt += hTicks*HP_REGEN_MS; }
  const mTicks = Math.floor((now - c.lastManaAt) / MANA_REGEN_MS);
  if(mTicks>0){ c.manaCur = clamp(c.manaCur + mTicks*MANA_REGEN_AMT, 0, eff.maxMana); c.lastManaAt += mTicks*MANA_REGEN_MS; }
  c.hpCur = clamp(c.hpCur, 0, eff.maxHp);
  c.energyCur = clamp(c.energyCur, 0, eff.maxEnergy);
  if(c.class!=='mage') c.manaCur = clamp(c.manaCur, 0, eff.maxMana);
}

// UI-only helper: how much Energy regenerates per hour, and how long until the next
// whole point / a full refill. The real Energy value always comes from applyRegen()
// above — this is purely for the countdown display.
function energyRegenInfo(c, eff){
  const perHour = energyRegenPerHour(eff.maxEnergy);
  if(c.energyCur >= eff.maxEnergy || perHour<=0) return { perHour, msToNext:0, msToFull:0 };
  const msPerPoint = (60*60*1000) / (ENERGY_REGEN_RATE_PER_HOUR * eff.maxEnergy);
  const remainingFraction = 1 - (c.energyCur % 1);
  return {
    perHour,
    msToNext: remainingFraction * msPerPoint,
    msToFull: (eff.maxEnergy - c.energyCur) * msPerPoint,
  };
}

/* ============================================================
   COMBAT ENGINE
   (Written as a self-contained "trusted" module: in a full
   Firebase build this logic runs server-side in a Cloud
   Function; the client would only ever send an action name
   and receive the resolved outcome. In this in-browser

function buildCombatant(character, isPlayerSide, label){
  const eff = effectiveStats(character);
  const cls = CLASSES[character.class];
  return {
    label: String(label || character.username || '').replace(/[<>&"'`]/g,''),
    isPlayerSide,
    charRef: character,
    class: character.class,
    level: character.level,
    resourceName: cls.resource,
    maxHp: eff.maxHp, hp: isPlayerSide ? clamp(character.hpCur,1,eff.maxHp) : eff.maxHp,
    atk: eff.atk, def: eff.def, spd: eff.spd, crit: eff.crit, eva: eff.eva,
    resourceMax: eff.resourceMax,
    resource: isPlayerSide ? (character.class==='mage' ? clamp(character.manaCur,0,eff.resourceMax) : clamp(character.resourceCur,0,eff.resourceMax)) : Math.round(eff.resourceMax*0.6),
    buffs: [],
    skills: cls.skills,
    skillLevels: character.classSkills || {},
  };
}
function buildMonster(zone, level, name, kind){
  const isBoss = kind==='boss', isElite = kind==='elite';
  const em = isElite ? 1.7 : 1;
  const hpMult = isBoss ? BOSS_MULT.hp : em;
  const atkMult = isBoss ? BOSS_MULT.atk : em;
  const defMult = isBoss ? BOSS_MULT.def : em;
  const hp = Math.round((38 + level*11 + rnd(-4,4)) * hpMult);
  const atk = Math.round((6 + level*2.1 + rnd(-1,1)) * atkMult);
  const def = Math.round((3 + level*1.25 + rnd(-1,1)) * defMult);
  const spdMult = isBoss ? 1.15 : isElite ? 1.15 : 1;
  const spd = Math.round((5 + level*0.75)*10)/10 * spdMult;
  const critVal = isBoss ? 11 : isElite ? 9 : 5;
  const evaVal = isBoss ? 8 : isElite ? 7 : 4;
  const label = isBoss ? name : (isElite ? 'Elite ' : '') + name;
  return {
    label, isPlayerSide:false, class:null, level,
    resourceName:null, maxHp:hp, hp, atk, def, spd, crit:critVal, eva:evaVal,
    resourceMax:0, resource:0, buffs:[], skills:[], isMonster:true, isElite, isBoss,
  };
}
// ELO change for ONE side of a fight. result: 'win' | 'lose' | 'draw'. A win always gives at least +1, a loss at least -1.
function pvpRatingChange(myRating, oppRating, result){
  const expected = 1/(1+Math.pow(10, (oppRating-myRating)/400));
  const score = result==='win' ? 1 : result==='lose' ? 0 : 0.5;
  let delta = Math.round(ELO_K * (score-expected));
  if(result==='win' && delta<1) delta = 1;
  if(result==='lose' && delta>-1) delta = -1;
  const newRating = clamp(myRating+delta, RATING_FLOOR, 100000);
  return { delta: newRating-myRating, newRating };
}

function buildBotOpponent(level, rating){
  const classId = pick(Object.keys(CLASSES));
  const bot = newCharacter('bot_'+uid(), pick(BOT_NAMES), classId);
  bot.level = clamp(level, 1, 200);
  bot.pvp.rating = rating;
  const skillLevel = clamp(Math.floor(bot.level/3), 0, MAX_SKILL_LEVEL);
  CLASSES[classId].skills.forEach(s=> bot.classSkills[s.id] = skillLevel);
  Object.keys(bot.generalSkills).forEach(k=> bot.generalSkills[k] = clamp(Math.floor(bot.level/4),0,GENERAL_SKILL_MAX));
  const gearTier = bot.level>=55?'rare':bot.level>=25?'uncommon':'common';
  EQUIP_SLOTS.forEach(slot=>{ bot.equipment[slot] = makeEquipment(slot, gearTier, bot.level); });
  const eff = effectiveStats(bot);
  bot.hpCur = eff.maxHp; bot.energyCur = eff.maxEnergy; bot.resourceCur = eff.resourceMax; bot.manaCur = eff.maxMana;
  bot.isBot = true;
  return bot;
}

function tickBuffs(fighter){
  fighter.buffs = fighter.buffs.filter(b=>{ b.rounds -= 1; return b.rounds > 0; });
}
function buffTotal(fighter, stat){
  return fighter.buffs.filter(b=>b.stat===stat).reduce((a,b)=>a+b.amount,0);
}
function liveStat(fighter, stat){
  return fighter[stat] + buffTotal(fighter, stat);
}
function rollDamage(att, def, mult, ignoreDefPct, forceCrit, critBonus){
  const atkStat = liveStat(att,'atk') * (mult||1);
  const defStat = liveStat(def,'def') * (1-(ignoreDefPct||0));
  let dmg = Math.max(2, atkStat - defStat*0.5);
  dmg *= rnd(0.87, 1.13);
  const critChance = clamp((liveStat(att,'crit') + (critBonus||0)) , 0, 90);
  const isCrit = forceCrit || (Math.random()*100 < critChance);
  if(isCrit) dmg *= 1.6;
  const evaChance = clamp(liveStat(def,'eva') - liveStat(att,'crit')*0.15, 0, 55);
  const evaded = Math.random()*100 < evaChance;
  if(evaded) dmg = 0;
  return { dmg: Math.round(dmg), crit:isCrit, evaded };
}
function resourceGainOnAttack(fighter){
  if(fighter.resourceMax<=0) return;
  fighter.resource = clamp(fighter.resource + Math.round(fighter.resourceMax*0.15), 0, fighter.resourceMax);
}

// Executes one actor's action against target. Returns log lines (array of {text,cls}).
function performAction(actor, target, action, skillLevel){
  const logs = [];
  const name = actor.label;
  if(action.kind==='attack'){
    const r = rollDamage(actor, target, action.boosted ? 1.5 : 1);
    if(r.evaded){ logs.push({text:`${name}'s attack is evaded by ${target.label}.`, cls:''}); }
    else { target.hp = clamp(target.hp - r.dmg, 0, target.maxHp); logs.push({text: action.boosted ? `${name} unleashes a savage blow for ${r.dmg}${r.crit?' (critical!)':''}!` : `${name} attacks for ${r.dmg}${r.crit?' (critical!)':''}.`, cls:'hit'}); }
    resourceGainOnAttack(actor);
  } else if(action.kind==='defend'){
    actor.buffs.push({stat:'def', amount: Math.round(liveStat(actor,'def')*0.6), rounds:2, tag:'Defend'});
    resourceGainOnAttack(actor);
    logs.push({text:`${name} braces to defend, sharply raising Defense.`, cls:'good'});
  } else if(action.kind==='item'){
    const item = action.item;
    if(item.effect.heal){ const amt = Math.round(actor.maxHp*item.effect.heal); actor.hp = clamp(actor.hp+amt, 0, actor.maxHp); logs.push({text:`${name} drinks a ${item.name}, recovering ${amt} HP.`, cls:'good'}); }
    if(item.effect.energy){ logs.push({text:`${name} drinks a ${item.name}, recovering Energy.`, cls:'good'}); }
  } else if(action.kind==='skill'){
    const s = action.skill;
    const lvl = skillLevel||0;
    actor.resource = clamp(actor.resource - s.cost, 0, actor.resourceMax);
    switch(s.type){
      case 'damage': {
        const mult = s.mult + s.multPerLvl*lvl;
        const r = rollDamage(actor, target, mult);
        if(r.evaded) logs.push({text:`${name} uses ${s.name}, but it's evaded!`, cls:''});
        else { target.hp = clamp(target.hp-r.dmg,0,target.maxHp); logs.push({text:`${name} uses ${s.name} for ${r.dmg}${r.crit?' (critical!)':''}.`, cls:'hit'}); }
        break;
      }
      case 'damage_crit_boost': {
        const mult = s.mult + s.multPerLvl*lvl;
        const r = rollDamage(actor, target, mult, 0, false, s.critBonus);
        if(r.evaded) logs.push({text:`${name} uses ${s.name}, but it's evaded!`, cls:''});
        else { target.hp = clamp(target.hp-r.dmg,0,target.maxHp); logs.push({text:`${name} uses ${s.name} for ${r.dmg}${r.crit?' (critical!)':''}.`, cls:'hit'}); }
        break;
      }
      case 'damage_ignore_def': {
        const mult = s.mult + s.multPerLvl*lvl;
        const r = rollDamage(actor, target, mult, s.ignorePct);
        if(r.evaded) logs.push({text:`${name} uses ${s.name}, but it's evaded!`, cls:''});
        else { target.hp = clamp(target.hp-r.dmg,0,target.maxHp); logs.push({text:`${name} uses ${s.name} for ${r.dmg}, piercing defenses.`, cls:'hit'}); }
        break;
      }
      case 'damage_resource_refund': {
        const mult = s.mult + s.multPerLvl*lvl;
        const r = rollDamage(actor, target, mult);
        actor.resource = clamp(actor.resource + s.refund, 0, actor.resourceMax);
        if(r.evaded) logs.push({text:`${name} uses ${s.name}, but it's evaded!`, cls:''});
        else { target.hp = clamp(target.hp-r.dmg,0,target.maxHp); logs.push({text:`${name} uses ${s.name} for ${r.dmg}, and feels a surge of ${actor.resourceName}.`, cls:'hit'}); }
        break;
      }
      case 'damage_debuff_atk': {
        const mult = s.mult + s.multPerLvl*lvl;
        const r = rollDamage(actor, target, mult);
        target.buffs.push({stat:'atk', amount:-Math.round(liveStat(target,'atk')*s.debuff), rounds:s.duration, tag:s.name});
        if(r.evaded) logs.push({text:`${name} uses ${s.name}, but it's evaded!`, cls:''});
        else { target.hp = clamp(target.hp-r.dmg,0,target.maxHp); logs.push({text:`${name} uses ${s.name} for ${r.dmg}, weakening ${target.label}'s Attack.`, cls:'hit'}); }
        break;
      }
      case 'damage_gold_bonus': {
        const mult = s.mult + s.multPerLvl*lvl;
        const r = rollDamage(actor, target, mult);
        actor._goldBonusPct = s.goldBonusPct;
        if(r.evaded) logs.push({text:`${name} uses ${s.name}, but it's evaded!`, cls:''});
        else { target.hp = clamp(target.hp-r.dmg,0,target.maxHp); logs.push({text:`${name} uses ${s.name} for ${r.dmg}.`, cls:'hit'}); }
        break;
      }
      case 'buff_def': {
        const amt = Math.round(s.amount + s.amountPerLvl*lvl);
        actor.buffs.push({stat:'def', amount:amt, rounds:s.duration, tag:s.name});
        logs.push({text:`${name} uses ${s.name}, raising Defense.`, cls:'good'});
        break;
      }
      case 'buff_atk': {
        const amt = Math.round(s.amount + s.amountPerLvl*lvl);
        actor.buffs.push({stat:'atk', amount:amt, rounds:s.duration, tag:s.name});
        logs.push({text:`${name} uses ${s.name}, raising Attack.`, cls:'good'});
        break;
      }
      case 'buff_spd_eva': {
        const amt = Math.round(s.amount + s.amountPerLvl*lvl);
        actor.buffs.push({stat:'spd', amount:amt, rounds:s.duration, tag:s.name});
        actor.buffs.push({stat:'eva', amount:amt, rounds:s.duration, tag:s.name});
        logs.push({text:`${name} uses ${s.name}, becoming faster and harder to hit.`, cls:'good'});
        break;
      }
      case 'buff_def_resource': {
        const amt = Math.round(s.amount + s.amountPerLvl*lvl);
        actor.buffs.push({stat:'def', amount:amt, rounds:s.duration, tag:s.name});
        actor.resource = clamp(actor.resource + s.refund, 0, actor.resourceMax);
        logs.push({text:`${name} uses ${s.name}, raising Defense and recovering ${actor.resourceName}.`, cls:'good'});
        break;
      }
      case 'heal': {
        const pct = s.pct + s.pctPerLvl*lvl;
        const amt = Math.round(actor.maxHp*pct);
        actor.hp = clamp(actor.hp+amt, 0, actor.maxHp);
        logs.push({text:`${name} uses ${s.name}, recovering ${amt} HP.`, cls:'good'});
        break;
      }
      case 'heal_and_def': {
        const pct = s.pct + s.pctPerLvl*lvl;
        const amt = Math.round(actor.maxHp*pct);
        actor.hp = clamp(actor.hp+amt, 0, actor.maxHp);
        actor.buffs.push({stat:'def', amount:s.defAmount, rounds:s.duration, tag:s.name});
        logs.push({text:`${name} uses ${s.name}, recovering ${amt} HP and raising Defense.`, cls:'good'});
        break;
      }
    }
  } else if(action.kind==='flee'){
    logs.push({text:`${name} attempts to flee...`, cls:''});
  }
  return logs;
}

function chooseAiAction(actor, target){
  const hpPct = actor.hp/actor.maxHp;
  const affordable = actor.skills.filter(s=> actor.resource >= s.cost);
  if(hpPct < 0.3 && affordable.some(s=>/heal/.test(s.type))){
    const s = affordable.find(x=>/heal/.test(x.type));
    return {kind:'skill', skill:s};
  }
  if(actor.isMonster){
    if(Math.random() < (actor.isBoss ? 0.3 : 0.22)) return {kind:'attack', boosted:true};
    return {kind:'attack'};
  }
  if(affordable.length && Math.random()<0.6){
    return {kind:'skill', skill: pick(affordable)};
  }
  if(hpPct < 0.35 && Math.random()<0.3){
    return {kind:'defend'};
  }
  return {kind:'attack'};
}
